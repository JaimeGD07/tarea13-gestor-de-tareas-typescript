<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gestión de Tareas</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>📋 Gestor de Tareas</h1>
      </header>

      <main class="app-main">
        <section class="task-form-section">
          <form id="task-form" novalidate>
            <input type="hidden" id="task-id" />

            <div class="form-group">
              <label for="task-title">Título</label>
              <input type="text" id="task-title" required maxlength="80" />
            </div>

            <div class="form-group">
              <label for="task-description">Descripción</label>
              <textarea id="task-description" rows="2" maxlength="300"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="task-category">Categoría</label>
                <input type="text" id="task-category" maxlength="30" placeholder="Ej. Trabajo" />
              </div>

              <div class="form-group">
                <label for="task-priority">Prioridad</label>
                <select id="task-priority">
                  <option value="low">Baja</option>
                  <option value="medium" selected>Media</option>
                  <option value="high">Alta</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" id="form-submit-btn">Agregar tarea</button>
              <button type="button" id="form-cancel-btn" hidden>Cancelar</button>
            </div>
          </form>
        </section>

        <section class="task-filters-section">
          <input type="search" id="search-input" placeholder="Buscar por título..." />

          <select id="status-filter">
            <option value="all">Todas</option>
            <option value="pending">Pendientes</option>
            <option value="completed">Completadas</option>
          </select>

          <select id="priority-filter">
            <option value="all">Cualquier prioridad</option>
            <option value="low">Baja</option>
            <option value="medium">Media</option>
            <option value="high">Alta</option>
          </select>
        </section>

        <section class="task-list-section">
          <ul id="task-list" class="task-list"></ul>
          <p id="empty-state" class="empty-state" hidden>No hay tareas que mostrar.</p>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
